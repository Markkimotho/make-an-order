<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make-An-Order — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container" style="max-width: 420px;">

        <!-- App icon + title -->
        <div class="login-app-icon">
            <i class="fas fa-cube"></i>
        </div>
        <h1>Staff Sign In</h1>
        <p class="lead" style="margin-bottom: 6px;">Access the management system.</p>
        <p style="font-size: 12px; color: var(--mac-text-muted); margin-bottom: 24px;">
            Managers, admins, and authorized staff only.<br>
            New staff? Request access to be approved by an admin.
        </p>

        {% if message %}
        <div class="alert" role="alert"
             style="font-size: 12px; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
                    background: #fff8e1; border: 1px solid #f0c040; color: #5d3900; text-align: left;">
            <i class="fas fa-circle-info me-1"></i>{{ message }}
        </div>
        {% endif %}

        <!-- email / password form -->
        <form action="/auth/login/local" method="POST" style="text-align: left; margin-bottom: 14px;">
            <div class="mb-2">
                <label style="font-size: 11px; font-weight: 600; color: var(--mac-text-sub); display: block; margin-bottom: 3px;">
                    Email address
                </label>
                <input type="email" name="email" class="form-control form-control-sm"
                       placeholder="you@example.com" required autocomplete="email"
                       style="font-size: 13px;">
            </div>
            <div class="mb-3">
                <label style="font-size: 11px; font-weight: 600; color: var(--mac-text-sub); display: block; margin-bottom: 3px;">
                    Password
                </label>
                <input type="password" name="password" class="form-control form-control-sm"
                       placeholder="••••••••" required autocomplete="current-password"
                       style="font-size: 13px;">
            </div>
            <button type="submit" class="btn btn-primary w-100" style="font-size: 13px; padding: 8px;">
                <i class="fas fa-arrow-right-to-bracket me-2"></i>Sign In
            </button>
        </form>

        <!-- Register link -->
        <p style="font-size: 12px; color: var(--mac-text-muted); text-align: center; margin: 0;">
            New staff member?
            <a href="/register" style="color: var(--mac-blue); text-decoration: none; font-weight: 600;">
                Request access
            </a>
            <br><br>
            <a href="/role-select" style="color: var(--mac-text-muted); text-decoration: none; font-size: 11px;">
                ← Back to role select
            </a>
        </p>
    </div>
</body>
</html>
