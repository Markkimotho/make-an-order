{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size: 80px; font-weight: 900; color: var(--mac-border); letter-spacing: -4px; line-height: 1;">404</div>
    <h2 class="mt-3 mb-2">{{ message | default("Page Not Found") }}</h2>
    <p class="lead mb-4">The resource you requested could not be found.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="fas fa-house me-2"></i>Go to Dashboard
    </a>
</div>
{% endblock %}
