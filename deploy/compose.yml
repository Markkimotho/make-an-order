# make-an-order: the whole system on one machine.
#
#   cd deploy
#   cp .env.example .env        # then fill it in
#   docker compose up -d --build
#
# Always on: db (MySQL 8.0), redis, app (gunicorn), backup (nightly dumps),
# jobs (M-Pesa sweep and daily SMS reminders).
# Profiles (set COMPOSE_PROFILES in .env, or pass --profile):
#   tunnel  cloudflared: online access and M-Pesa callbacks, no port forwarding
#   vps     caddy: HTTPS with automatic certificates for APP_DOMAIN
#
# Local shop (default): the app answers on port 80 of every interface, so
# other tills open http://<server-ip> (deploy/scripts/lan-address.sh prints it).
# VPS: set APP_BIND=127.0.0.1 and APP_PORT=8080 so only caddy is public.
name: mao

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: make-an-order:${APP_IMAGE_TAG:-local}
  restart: unless-stopped
  environment: &app-env
    APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in deploy/.env}
    APP_URL: ${APP_URL:-http://localhost}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    TENANT_SECRETS_KEY: ${TENANT_SECRETS_KEY:-}
    PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
    PROXY_FIX_X_FOR: ${PROXY_FIX_X_FOR:-0}
    PROXY_FIX_X_PROTO: ${PROXY_FIX_X_PROTO:-1}
    MYSQL_HOST: db
    MYSQL_DB: ${MYSQL_DB:-mao}
    MYSQL_USER: ${MYSQL_USER:-mao}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
    REDIS_URL: redis://redis:6379/0
    AT_USERNAME: ${AT_USERNAME:-sandbox}
    AT_API_KEY: ${AT_API_KEY:-}
    AT_SENDER_ID: ${AT_SENDER_ID:-}
    SINGLE_BUSINESS_INSTALL: ${SINGLE_BUSINESS_INSTALL:-true}
    BACKUP_DIR: /app/backups
    BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    BACKUP_VERIFY_MYSQL_URL: ${BACKUP_VERIFY_MYSQL_URL:-}
    RCLONE_CONFIG: /config/rclone/rclone.conf
    TZ: UTC
  volumes:
    - ${BACKUP_VOLUME:-backups}:/app/backups
    - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: ${MYSQL_DB:-mao}
      MYSQL_USER: ${MYSQL_USER:-mao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP on 127.0.0.1: the image's first-boot setup server listens on a
      # socket only, so this passes only once the real server is up.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  app:
    <<: *app
    command: ["web"]
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backup:
    <<: *app
    command: ["backup-loop"]
    environment:
      <<: *app-env
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-20}
      BACKUP_CHECK_MINUTES: ${BACKUP_CHECK_MINUTES:-60}

  jobs:
    <<: *app
    command: ["jobs-loop"]

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

  caddy:
    image: caddy:2.8
    profiles: ["vps"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
